[project]
name = "sinucadas"
version = "0.1.0"
description = "Sinucadas (Atividade 02) — Jogo 2D em ModernGL"
requires-python = ">=3.11"
dependencies = [
    "glfw>=2.10.0",
    "moderngl>=5.13.0",
    "numpy>=2.4.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[tool.uv]
package = false

[tool.ruff]
cache-dir = "/tmp/ruff-cache"
line-length = 96
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
